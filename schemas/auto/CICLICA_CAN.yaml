  - index: 5
    name: RiferimentoMaxR
    raw_name: eRiferimentoMaxR
    description: Riferimento del comando MAX R ( se minore a 32 è riferito al CE16 altrimenti al position del MLT )
    type: string
  - index: 6
    name: RiferimentoMaxE
    raw_name: eRiferimentoMaxE
    description: Riferimento del comando MAX E ( se minore a 32 è riferito al CE16 altrimenti al position del MLT )
