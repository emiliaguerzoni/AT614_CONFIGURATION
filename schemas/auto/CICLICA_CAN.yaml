    name: TimerCiclica
    raw_name: eTimerCiclica
    description: Tempo totale della ciclica
    type: string
  - index: 2
    name: TimerCiclicaSingoloCiclo
    raw_name: eTimerCiclicaSingoloCiclo
    description: "Tempo della singola forma d'onda della ciclica"
    type: string
  - index: 3
    name: SourceAddress
    raw_name: eSourceAddress
    description: Source address del messaggio AVC da trasmettere
    type: string
  - index: 4
    name: RiferimentoNeutro
    raw_name: eRiferimentoNeutro
    description: Riferimento del comando NEUTRO ( se minore a 32 è riferito al CE16 altrimenti al position del MLT )
